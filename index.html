<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>삐약 파닉스</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ecdc;--green:#dfe8d0;--green2:#c9d9b4;--ink:#6b4f3a;--pink:#f2a1a8;--pink2:#fde3e5;--card:#fffdf7;--accent:#e8727d;--ok:#6aa84f;--no:#d9777f}
@media (prefers-color-scheme:dark){:root[data-x]{}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.frame{height:100%;max-width:640px;margin:0 auto;padding:14px;background:
 linear-gradient(90deg,rgba(255,255,255,.35) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.35) 50%,transparent 50%),var(--green);background-size:28px 28px}
.board{height:100%;background:var(--card);border-radius:26px;border:3px solid var(--green2);box-shadow:0 4px 0 var(--green2);position:relative;display:flex;flex-direction:column}
.tape{position:absolute;top:-10px;width:70px;height:22px;background:rgba(214,184,150,.8);border-radius:3px;z-index:3}
.tape.l{left:22px;transform:rotate(-8deg)}.tape.r{right:22px;transform:rotate(8deg)}
.view{display:none;flex:1;min-height:0;overflow-y:auto;padding:26px 18px 18px;flex-direction:column;gap:14px}
.view.on{display:flex}
h1{font-size:34px;margin:0;color:var(--accent);text-align:center}
h2{font-size:22px;margin:0}
.chip{display:inline-block;background:var(--pink2);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:14px}
.btn{border:0;border-radius:18px;padding:14px 18px;font:inherit;font-size:18px;color:#fff;background:var(--pink);box-shadow:0 4px 0 #d9858d;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9858d}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--green2);border:2px solid var(--green2)}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:999px;box-shadow:0 3px 0 var(--green2)}
input{width:100%;padding:14px;border:2px dashed var(--green2);border-radius:16px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--pink)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;background:var(--green);padding:5px;border-radius:18px}
.tabs button{flex:1;border:0;border-radius:14px;padding:10px;font:inherit;font-size:16px;background:transparent;color:var(--ink);cursor:pointer}
.tabs button.on{background:#fff;color:var(--accent);box-shadow:0 2px 0 var(--green2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border:2px solid var(--green2);border-radius:20px;padding:12px 4px;text-align:center;cursor:pointer;box-shadow:0 3px 0 var(--green2)}
.tile b{display:block;font-size:40px;color:var(--accent);font-weight:400}
.tile small{font-size:12px;background:var(--green);border-radius:99px;padding:2px 8px}
.tile.done{background:var(--pink2);border-color:var(--pink)}
.card{background:#fff;border:3px solid var(--green2);border-radius:24px;padding:16px;text-align:center}
.big{font-size:72px;line-height:1.1;color:var(--accent)}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w{background:#fff;border:2px solid var(--green2);border-radius:16px;padding:8px;text-align:center;transition:.2s}
.w.hl{background:var(--pink2);border-color:var(--pink);transform:scale(1.05)}
.w i{font-style:normal;font-size:32px;display:block}
.mic{width:88px;height:88px;border-radius:50%;border:5px solid #fff;background:var(--pink);box-shadow:0 5px 0 #d9858d;font-size:36px;cursor:pointer;align-self:center}
.mic.rec{background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,114,125,.5)}100%{box-shadow:0 0 0 22px rgba(232,114,125,0)}}
.fb{min-height:44px;text-align:center;font-size:16px;border-radius:16px;padding:8px 12px}
.fb.ok{background:#e4f1d8;color:#4b7c35}.fb.no{background:#fbe3e5;color:#b0525a}.fb.info{background:var(--green)}
.bar{height:14px;background:var(--green);border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--pink);width:0;transition:width .8s}
.pals{position:absolute;bottom:-6px;right:12px;font-size:34px;pointer-events:none;opacity:.9}
.bdg{width:100%;max-width:64px;aspect-ratio:1;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;background:radial-gradient(circle at 35% 30%,#ffc2c8,var(--pink) 60%,#e07983);border:4px solid #fff;box-shadow:0 0 0 3px var(--pink),0 4px 0 #d9858d}
.bdg.off{background:#e8e2d3;color:#fff;box-shadow:0 0 0 3px #d9d2c0;opacity:.6}
.bdg.sm{width:30px;height:30px;max-width:none;margin:0;font-size:15px;border-width:2px;box-shadow:0 0 0 2px var(--pink)}
.bdg.big2{width:130px;max-width:none;font-size:70px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.srow{flex-wrap:wrap}.bw{flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px}
.srow{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px dashed var(--green2);font-size:15px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:9;display:none;max-width:90%;font-size:15px}
#conf{position:fixed;inset:0;background:rgba(243,236,220,.94);z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:30px;color:var(--accent)}
</style>
</head>
<body>
<div id="toast"></div>
<div id="conf"><div style="font-size:80px">🐰🐿️</div>삐약삐약! 뱃지 획득!</div>
<div class="frame"><div class="board"><span class="tape l"></span><span class="tape r"></span>

<section id="v-login" class="view on" style="justify-content:center">
  <h1>🐥 삐약 파닉스</h1>
  <div style="text-align:center"><span class="chip">토끼·다람쥐와 영어 발음 연습!</span></div>
  <div class="tabs"><button id="t-s" class="on" onclick="loginTab('s')">학생</button><button id="t-t" onclick="loginTab('t')">선생님</button></div>
  <div id="s-in" style="display:grid;gap:10px"><input id="lid" placeholder="학번 (예: 20401)" inputmode="numeric"><input id="lname" placeholder="이름"></div>
  <input id="lpw" type="password" placeholder="비밀번호">
  <button class="btn" id="lbtn" onclick="login()">시작하기 🐣</button>
  <div class="pals">🐰🐿️</div>
</section>

<section id="v-home" class="view">
  <div class="row"><div><span class="chip">환영해, 친구야!</span><h2 id="uname"></h2></div><button class="btn sm alt" onclick="showBadges()">나의 뱃지 🏅</button></div>
  <div class="row"><h2>어떤 소리를 배울까? 🐣</h2><button class="btn sm alt" id="lo" onclick="logout()">로그아웃</button></div>
  <div class="tabs"><button id="t-v" onclick="grid('v')">모음</button><button id="t-c" onclick="grid('c')">자음</button></div>
  <div id="pg" class="grid"></div>
</section>

<section id="v-badge" class="view">
  <div class="row"><h2>나의 뱃지들 🏅</h2><button class="btn sm alt" onclick="showHome()">뒤로</button></div>
  <div class="card"><div class="row"><span>모은 뱃지</span><b id="bc" style="font-size:26px;color:var(--accent)">0/26</b></div><div class="bar"><div id="bp"></div></div></div>
  <div id="bg" class="grid" style="grid-template-columns:repeat(5,1fr)"></div>
</section>

<section id="v-pos" class="view" style="justify-content:center;text-align:center">
  <div class="row" style="position:absolute;top:22px;left:18px;right:18px"><span class="chip">학습 위치 선택</span><button class="btn sm alt" onclick="showHome()">뒤로</button></div>
  <div class="big" id="pl"></div>
  <h2>이 알파벳이 단어의 어디에 올 때 연습할까요?</h2>
  <div id="pb" style="display:grid;gap:12px"></div>
</section>

<section id="v-intro" class="view">
  <div class="row"><span class="chip">미니 강의</span><button class="btn sm alt" onclick="showPos(cur)">다시 선택</button></div>
  <div class="card row"><div class="big" style="font-size:52px" id="il"></div><span style="flex:1">▶ 눌러서 소리를 들어요!</span><button class="btn" onclick="playIntro()">▶</button></div>
  <div id="iw" class="words"></div>
  <button class="btn" onclick="startPractice()">연습 시작! 🐥</button>
</section>

<section id="v-prac" class="view">
  <div class="row"><span class="chip" id="pp"></span><button class="btn sm alt" onclick="showHome()">그만하기</button></div>
  <div class="card" style="position:relative">
    <span class="chip" id="ppos"></span>
    <div id="pi" style="font-size:80px;cursor:pointer" onclick="speak(words[idx].t)">🍎</div>
    <div id="pw" style="font-size:40px;color:var(--accent)"></div>
    <div id="pm" style="font-size:20px"></div>
    <button class="btn" style="margin-top:8px" onclick="speak(words[idx].t)">🔊 듣기</button>
  </div>
  <div id="fb" class="fb info">마이크를 누르고 또렷하게 말해요!</div>
  <button id="mic" class="mic" onclick="toggleMic()">🎤</button>
</section>

<section id="v-teacher" class="view">
  <div class="row"><h2>선생님 화면 👩‍🏫</h2><button class="btn sm alt" onclick="logout()">로그아웃</button></div>
  <div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><div>등록 학생</div><b id="tsc" style="font-size:30px;color:var(--accent)">0</b></div><div class="card"><div>총 연습</div><b id="tlc" style="font-size:30px;color:var(--accent)">0</b></div></div>
  <div class="chip" id="tsrc" style="align-self:flex-start"></div>
  <div id="tl" class="card" style="padding:4px;text-align:left"></div>
</section>
</div></div>

<script>
// 데이터: 글자|위치|단어 아이콘 뜻 ... (위치 처/중/끝)
const RAW={v:`A|처|Apple🍎사과,Ant🐜개미,Arm💪팔|중|Cat🐱고양이,Cake🍰케이크,Ball🏀공|끝|Banana🍌바나나,Panda🐼판다,Pizza🍕피자
E|처|Egg🥚계란,Eagle🦅독수리,Ear👂귀|중|Pen🖊️펜,Bed🛏️침대,Desk🪑책상|끝|House🏠집,Horse🐴말,Rose🌹장미
I|처|Ice🧊얼음,Igloo🛖이글루,Island🏝️섬|중|Pig🐷돼지,Fish🐟물고기,Milk🥛우유|끝|Taxi🚕택시,Kiwi🥝키위,Sushi🍣초밥
O|처|Owl🦉올빼미,Orange🍊오렌지,Ocean🌊바다|중|Dog🐶개,Frog🐸개구리,Moon🌕달|끝|Hippo🦛하마,Tomato🍅토마토,Potato🥔감자
U|처|Umbrella☂️우산,Unicorn🦄유니콘,Up⬆️위로|중|Cup☕컵,Sun☀️태양,Duck🦆오리|끝|Menu📜메뉴,Glue🧴풀,Statue🗽동상`,
c:`B|처|Bear🐻곰,Bus🚌버스,Book📖책|중|Rabbit🐰토끼,Robot🤖로봇,Ribbon🎀리본|끝|Web🕸️거미줄,Crab🦀게,Tub🛁욕조
C|처|Cat🐱고양이,Car🚗자동차,Cup☕컵|중|Soccer⚽축구,Rocket🚀로켓,Doctor🩺의사|끝|Music🎵음악,Magic🪄마술,Picnic🍱소풍
D|처|Dog🐶개,Duck🦆오리,Door🚪문|중|Spider🕷️거미,Window🪟창문,Candy🍬사탕|끝|Bed🛏️침대,Bird🐦새,Hand✋손
F|처|Fish🐟물고기,Fox🦊여우,Fire🔥불|중|Muffin🧁머핀,Coffee☕커피,Waffle🧇와플|끝|Leaf🍃나뭇잎,Wolf🐺늑대,Chef🧑‍🍳요리사
G|처|Goat🐐염소,Game🎮게임,Gift🎁선물|중|Tiger🐯호랑이,Dragon🐉용,Burger🍔햄버거|끝|Pig🐷돼지,Frog🐸개구리,Bag👜가방
H|처|Hat🎩모자,House🏠집,Horse🐴말|중|Beehive🐝벌집,Rehab🏥재활,Behave😇행동하다
J|처|Jam🍯잼,Juice🥤주스,Jet✈️제트기|중|Ninja🥷닌자,Pajamas👘파자마,Project📋프로젝트
K|처|Key🔑열쇠,Kite🪁연,King👑왕|중|Monkey🐒원숭이,Rocket🚀로켓,Cookie🍪쿠키|끝|Book📖책,Duck🦆오리,Sock🧦양말
L|처|Lion🦁사자,Lemon🍋레몬,Lamp💡램프|중|Melon🍈멜론,Balloon🎈풍선,Color🎨색깔|끝|Ball🏀공,Snail🐌달팽이,Girl👧소녀
M|처|Monkey🐒원숭이,Moon🌕달,Map🗺️지도|중|Lemon🍋레몬,Camel🐫낙타,Hammer🔨망치|끝|Jam🍯잼,Drum🥁북,Farm🚜농장
N|처|Nest🪹둥지,Nose👃코,Nine9️⃣아홉|중|Snail🐌달팽이,Banana🍌바나나,Window🪟창문|끝|Sun☀️태양,Pen🖊️펜,Train🚂기차
P|처|Pig🐷돼지,Panda🐼판다,Pizza🍕피자|중|Apple🍎사과,Spider🕷️거미,Hippo🦛하마|끝|Cup☕컵,Ship🚢배,Soup🍲수프
Q|처|Queen👑여왕,Quilt🛏️이불,Quiz📝퀴즈|중|Squirrel🐿️다람쥐,Square🔲네모,Liquid🫗액체
R|처|Rabbit🐰토끼,Rose🌹장미,Robot🤖로봇|중|Turtle🐢거북이,Carrot🥕당근,Mirror🪞거울|끝|Car🚗자동차,Star⭐별,Door🚪문
S|처|Sun☀️태양,Snake🐍뱀,Star⭐별|중|Desk🪑책상,Castle🏰성,Basket🧺바구니|끝|Bus🚌버스,Dress👗드레스,Glass🥛유리잔
T|처|Tiger🐯호랑이,Tree🌲나무,Train🚂기차|중|Water💧물,Turtle🐢거북이,Guitar🎸기타|끝|Cat🐱고양이,Hat🎩모자,Boat🛥️보트
V|처|Van🚐밴,Violin🎻바이올린,Vase🏺꽃병|중|River🏞️강,Glove🧤장갑,Cave🕳️동굴|끝|Love❤️사랑,Dove🕊️비둘기,Wave🌊파도
W|처|Water💧물,Wolf🐺늑대,Window🪟창문|중|Flower🌸꽃,Towel🧣수건,Shower🚿샤워
X|처|Xylophone🎹실로폰,X-ray🦴엑스레이,Xmas🎄크리스마스|중|Taxi🚕택시,Boxer🥊복서,Mixer🥣믹서기|끝|Box📦상자,Fox🦊여우,Six6️⃣여섯
Y|처|Yellow🟡노란색,Yogurt🍦요거트,Yarn🧶털실|중|Crayon🖍️크레파스,Royal👑왕실의,Papaya🥭파파야|끝|Boy👦소년,Toy🧸장난감,Sky☁️하늘
Z|처|Zebra🦓얼룩말,Zoo🦁동물원,Zero0️⃣영|중|Puzzle🧩퍼즐,Lizard🦎도마뱀,Wizard🧙마법사|끝|Buzz🐝윙윙,Jazz🎷재즈,Quiz📝퀴즈`};
const POS={처:'처음',중:'중간',끝:'끝'};
const DATA={v:[],c:[]};
for(const k of['v','c'])RAW[k].split('\n').forEach(l=>{const p=l.split('|');const o={letter:p[0],words:[]};
 for(let i=1;i<p.length;i+=2)p[i+1].split(',').forEach(s=>{const m=s.match(/^([A-Za-z-]+)(\D*?)([가-힣].*)$/);if(m)o.words.push({t:m[1],icon:m[2],m:m[3],pos:POS[p[i]]})});DATA[k].push(o)});
const ALL=[...DATA.v,...DATA.c].map(d=>d.letter);

// 브라우저 소리 엔진 강제 깨우기 (첫 터치 시 무음 재생)
let engineAwake = false;
function wakeUpEngine() {
    if (engineAwake || !window.speechSynthesis) return;
    engineAwake = true;
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    speechSynthesis.speak(u);
}
document.addEventListener('click', wakeUpEngine, {once:true});
document.addEventListener('touchstart', wakeUpEngine, {once:true});

// 선생님 비밀번호는 SHA-256 해시로만 저장 (평문 없음)
const TH='d464c8588a9bae97bb0ab967b4e8170e9f72490c396921f8dd82bc525eadcff2',SALT='bbiyak';
const $=id=>document.getElementById(id);
let me=null,tab='s',gtype='v',cur=null,tpos=null,words=[],idx=0,scores=[],db=null,isOwner=false,local={};
try{local=JSON.parse(localStorage.getItem('bbiyak_v2')||'{}')}catch(e){local={}}
const saveLocal=()=>{try{localStorage.setItem('bbiyak_v2',JSON.stringify(local))}catch(e){}};
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+s.length+s.split('').reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)}}
// 공유 DB 연결 (가능할 때만, 안 되면 이 기기 저장소 사용)
(async()=>{try{if(window.claude){db=await claude.use('db');const u=await claude.use('user');isOwner=!!(u&&u.isOwner())}}catch(e){db=null}})();
async function getStu(id){let r=local[id]||null;if(db){try{const s=await db.doc('students/'+id).get();if(s.exists)r=s.data()}catch(e){}}return r}
async function putStu(u){local[u.id]=u;saveLocal();if(db&&u.id!=='guest'){try{await db.doc('students/'+u.id).set(u)}catch(e){}}}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3000)}
function view(id){
 document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
 $('v-'+id).classList.add('on');
 try{speechSynthesis.cancel()}catch(e){}
 stopMic();
 autoMic=false; // 화면을 벗어날 때는 자동 마이크 비활성화
}
function loginTab(t){tab=t;$('t-s').className=t=='s'?'on':'';$('t-t').className=t=='t'?'on':'';$('s-in').style.display=t=='s'?'grid':'none';$('lpw').placeholder=t=='s'?'비밀번호':'관리자 비밀번호';$('lbtn').textContent=t=='s'?'시작하기 🐣':'관리자 로그인'}
async function login(){
 const pw=$('lpw').value;if(tab=='s')ensureMic();
 if(tab=='t'){if(isOwner||await sha(pw)===TH){me={role:'teacher'};return teacher()}return toast('비밀번호가 맞지 않아요.')}
 const id=$('lid').value.trim(),name=$('lname').value.trim();
 if(!id||!name||!pw)return toast('모두 입력해 주세요.');
 const h=await sha(id+pw),ex=await getStu(id);
 if(ex){if((ex.pw||ex.password)!==h)return toast('비밀번호가 맞지 않아요.');me=ex}
 else{me={id,name,pw:h,role:'student',badges:[],logs:[]};await putStu(me);toast('계정이 만들어졌어요! 🐣')}
 showHome()}
function logout(){me=null;['lid','lname','lpw'].forEach(i=>$(i).value='');view('login')}
function showHome(){$('uname').textContent=me.name+' 학생';$('lo').textContent=me.id==='guest'?'로그인':'로그아웃';grid(gtype);view('home')}
function grid(t){gtype=t;$('t-v').className=t=='v'?'on':'';$('t-c').className=t=='c'?'on':'';const g=$('pg');g.innerHTML='';
 DATA[t].forEach(d=>{const e=document.createElement('div');e.className='tile'+(me.badges.includes(d.letter)?' done':'');e.innerHTML=`<b>${d.letter}</b><small>단어 ${d.words.length}개</small>`;e.onclick=()=>showPos(d);g.appendChild(e)})}
function showBadges(){const n=me.badges.length;$('bc').textContent=n+'/26';setTimeout(()=>$('bp').style.width=Math.round(n/26*100)+'%',50);
 $('bg').innerHTML=ALL.map(l=>`<div class="bdg ${me.badges.includes(l)?'':'off'}">${l}</div>`).join('');view('badge')}
function showPos(d){cur=d;$('pl').textContent=d.letter;const b=$('pb');b.innerHTML='';
 [['처음','🏁 처음에 올 때'],['중간','🔄 중간에 올 때'],['끝','🎯 끝에 올 때']].forEach(([p,l])=>{if(!d.words.some(w=>w.pos==p))return;const x=document.createElement('button');x.className='btn alt';x.textContent=l;x.onclick=()=>{tpos=p;words=d.words.filter(w=>w.pos==p);intro()};b.appendChild(x)});view('pos')}
function intro(){$('il').textContent=cur.letter;$('iw').innerHTML=words.map((w,i)=>`<div class="w" id="iw${i}"><i>${w.icon}</i><b>${w.t}</b><div style="font-size:13px">${w.m}</div></div>`).join('');view('intro')}
let voices=[];function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}

// TTS 즉시 동기화 실행 (setTimeout 제거)
function speak(t,rate=.7,cb){
 if(!window.speechSynthesis){toast('이 기기는 소리 읽기를 지원하지 않아요 😢');return cb&&cb()}
 const ss=window.speechSynthesis;
 try{ss.cancel(); ss.resume();}catch(e){} // 이전 소리 강제 정리
 const u=new SpeechSynthesisUtterance(t);
 u.lang='en-US';u.rate=rate;
 if(!voices.length) loadVoices();
 const v=voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
 if(v)u.voice=v;
 
 let called=false;
 const fin=()=>{if(!called){called=true;cb&&cb()}};
 u.onend=fin;
 u.onerror=fin;
 
 ss.speak(u);
 if(cb)setTimeout(fin,7000); // 7초 이상 멈춰있을 경우 대비 안전장치
}

function hl(n){words.forEach((_,i)=>{const e=$('iw'+i);if(e)e.className='w'+(i==n?' hl':'')})}
function playIntro(){let i=0;const nx=()=>{if(i>=words.length)return setTimeout(()=>hl(-1),800);hl(i);const w=words[i++].t;speak(w,.6,()=>setTimeout(nx,900))};speak('Letter '+cur.letter,.7,nx)}
function startPractice(){ensureMic();idx=0;scores=[];view('prac');ui()}
function ui(){const w=words[idx];$('pp').textContent=`도전! ${idx+1} / ${words.length}`;$('ppos').textContent=`${cur.letter}가 '${w.pos}'에 있어요 💡`;$('pi').textContent=w.icon;$('pw').textContent=w.t;$('pm').textContent=w.m;fb('마이크를 누르고 또렷하게 말해요!','info')}
function fb(m,t){const e=$('fb');e.textContent=m;e.className='fb '+t}

// ---- 향상된 음성 인식 (Auto-Mic 탑재 및 연결 안정성 강화) ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recOn=false,gotResult=false,timer=null,micOK=false,autoMic=false;

function norm(s){const D=['zero','one','two','three','four','five','six','seven','eight','nine'];return(s||'').toLowerCase().replace(/\d/g,d=>D[d]).replace(/[^a-z]/g,'')}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
function score(spoken,target){const s=norm(spoken),t=norm(target);if(!s)return 0;if(s==t)return 100;
 if(s.includes(t)||(t.length>3&&t.includes(s)&&s.length>=t.length-1))return 92;
 const a=1-lev(s,t)/Math.max(s.length,t.length),ps=pn(s),pt=pn(t),b=ps==pt?.9:1-lev(ps,pt)/Math.max(ps.length,pt.length);
 return Math.round(Math.max(a,b)*100)}
function pn(s){return s.replace(/ph/g,'f').replace(/ck/g,'k').replace(/c(?![ei])/g,'k').replace(/x/g,'ks').replace(/(.)\1+/g,'$1')}

async function ensureMic(){
 if(micOK)return true;
 try{
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
   const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
   st.getTracks().forEach(t=>t.stop())
  }
  micOK=true;return true
 }catch(e){
  fb('마이크 권한을 허용해 주세요! (주소창 🔒 → 마이크 허용)','no');return false
 }
}

// 음성 인식 객체를 항상 새로 생성하여 브라우저 엔진 멈춤/연결 끊김 완벽 방지
function initMic(){
 if(!SR) return;
 // 인스턴스를 매번 새로 만들어 이전 버그나 쓰레기 데이터를 초기화합니다.
 rec=new SR();
 rec.lang='en-US';
 rec.interimResults=true;
 rec.maxAlternatives=1;
 rec.continuous=false; 

 rec.onstart=()=>{
  recOn=true;
  const m=$('mic'); if(m) m.classList.add('rec');
  fb('듣고 있어요… 말해 보세요! 🎤','info');
  timer=setTimeout(()=>stopMic(true),7000);
 };
 
 rec.onresult=e=>{
  const r=e.results[e.results.length-1];
  let best=0,bestT='';
  for(let i=0;i<r.length;i++){
   const sc=score(r[i].transcript,words[idx].t);
   if(sc>best){best=sc;bestT=r[i].transcript}
  }
  if(!r.isFinal){
   if(best>=85){gotResult=true;judge(best,bestT);stopMic(true)}
   return
  }
  gotResult=true;judge(best,bestT)
 };

 rec.onerror=e=>{
  const m={'not-allowed':'마이크 권한을 허용해주세요 (주소창 자물쇠 🔒 클릭)','service-not-allowed':'마이크가 막혀 있어요. 새 창에서 열어주세요.','no-speech':'소리가 안 들렸어요. 다시 해볼까요? 😢','audio-capture':'마이크를 찾을 수 없어요.','network':'인터넷 연결을 확인해 주세요.'};
  if(e.error!='aborted'){
   fb(m[e.error]||'인식 오류('+e.error+'). 다시 눌러 주세요.','no');
   autoMic=false; // 에러가 나면 자동 켜기 취소
  }
 };

 rec.onend=()=>{
  const had=gotResult;
  resetMic();
  if(!had&&!$('fb').className.includes('no')&&!$('fb').className.includes('ok')){
   fb('잘 못 들었어요. 다시 눌러서 말해 볼까요? 🐣','no');
   autoMic=false;
  }
 };
}

async function toggleMic(){
 if(recOn){stopMic(true); autoMic=false; return} // 작동 중 누르면 수동 정지
 if(!SR){fb('음성 인식을 지원하지 않는 브라우저입니다. 크롬/사파리 앱을 열어주세요.','no'); return}
 
 const ok=await ensureMic();
 if(!ok) return;

 try{speechSynthesis.cancel()}catch(e){}
 
 initMic(); // 켤 때마다 항상 안전하게 새로 연결
 gotResult=false;
 autoMic=true; // 버튼을 눌러서 시작했다면, 다음 단어부터는 자동으로 켜지도록 설정
 
 try{rec.start()}catch(e){resetMic();fb('다시 한 번 눌러 주세요.','no')}
}

function stopMic(soft){
 clearTimeout(timer);
 if(rec){try{soft?rec.stop():rec.abort()}catch(e){}}
 if(!soft)resetMic()
}

function resetMic(){
 recOn=false;
 clearTimeout(timer);
 const m=$('mic');
 if(m)m.classList.remove('rec')
}

function judge(sc,said){
 if(sc>=80){
  fb(`최고야! "${said}" (${sc}점) ✨`,'ok');
  scores[idx]=sc;
  setTimeout(()=>nextWord(sc),1300)
 }else{
  fb(sc>=50?`조금만 더! "${said}"로 들렸어요 (${sc}점) 🐣`:`다시 해볼까? "${said}"로 들렸어요 🐤 먼저 🔊 듣기를 눌러 보세요`,'no');
  autoMic=false; // 발음이 틀렸을 땐 다시 듣고 준비할 수 있게 자동마이크를 끔
 }
}

function nextWord(sc){
 if(scores[idx]==null)scores[idx]=sc||0;
 if(idx<words.length-1){
  idx++;
  ui();
  
  // 성공해서 넘어왔고 자동 마이크가 켜져있다면, 약간의 지연 후 바로 시작
  if(autoMic){
   setTimeout(()=>{
    if(!recOn) {
     gotResult=false;
     initMic(); // 다음 단어에서도 항상 새로 연결
     try{rec.start()}catch(e){}
    }
   }, 800);
  }
 }else finish()
}

async function finish(){
 const avg=Math.round(scores.reduce((a,b)=>a+b,0)/words.length);
 me.logs.unshift({date:new Date().toLocaleDateString('ko-KR'),letter:cur.letter,position:tpos,score:avg,passed:true});me.logs=me.logs.slice(0,50);
 const isNew=!me.badges.includes(cur.letter);if(isNew)me.badges.push(cur.letter);
 await putStu(me);
 const all=scores.every(x=>x>=80);
 $('conf').innerHTML=`<div style="font-size:60px">🎉🐰🐿️🎉</div><div class="bdg big2">${cur.letter}</div><div style="text-align:center;padding:0 16px">${all?'축하해요! 모든 단어를 통과했어요!':'연습 완료!'}</div><div style="font-size:20px">${isNew?'새 뱃지 획득! 🏅 ':''}평균 ${avg}점</div>`;
 $('conf').style.display='flex';setTimeout(()=>{$('conf').style.display='none';showHome()},3500)}

// ---- 선생님 ----
async function teacher(){let list=Object.values(local);let src='이 기기에 저장된 학생';
 if(db){try{const q=await db.collection('students').get();const m={};list.forEach(s=>m[s.id]=s);q.docs.forEach(d=>{const v=d.data();if(v)m[v.id]=v});list=Object.values(m);src='공유 DB의 모든 학생'}catch(e){}}
 list=list.filter(s=>s.role=='student'&&s.id!=='guest');$('tsrc').textContent='🗂 '+src;$('tsc').textContent=list.length+'명';$('tlc').textContent=list.reduce((a,s)=>a+s.logs.length,0)+'건';
 $('tl').innerHTML=list.length?list.map(s=>{const l=s.logs[0];return`<div class="srow"><b style="flex:1">${esc(s.name)}<br><small>${esc(s.id)}</small></b><span class="chip">${s.badges.length}/26</span><span style="flex:1;text-align:right">${l?`${l.passed?'🌟':'💦'} ${esc(l.letter)} ${l.score}점<br><small>${esc(l.date)}</small>`:'아직 연습 안 함'}</span><div class="bw">${s.badges.length?s.badges.map(b=>`<span class="bdg sm">${esc(b)}</span>`).join(''):'<small>뱃지 없음</small>'}</div></div>`}).join(''):'<div style="padding:30px;text-align:center">🥚 아직 학생이 없어요</div>';
 view('teacher')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function guest(){me=local.guest||{id:'guest',name:'친구',role:'student',badges:[],logs:[]};local.guest=me;showHome()}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&$('v-login').classList.contains('on'))login()});
</script>
