<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>삐약 파닉스</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ecdc;--green:#dfe8d0;--green2:#c9d9b4;--ink:#6b4f3a;--pink:#f2a1a8;--pink2:#fde3e5;--card:#fffdf7;--accent:#e8727d;--ok:#6aa84f;--no:#d9777f}
@media (prefers-color-scheme:dark){:root[data-x]{}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.frame{height:100%;max-width:640px;margin:0 auto;padding:14px;background:
 linear-gradient(90deg,rgba(255,255,255,.35) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.35) 50%,transparent 50%),var(--green);background-size:28px 28px}
.board{height:100%;background:var(--card);border-radius:26px;border:3px solid var(--green2);box-shadow:0 4px 0 var(--green2);position:relative;display:flex;flex-direction:column}
.tape{position:absolute;top:-10px;width:70px;height:22px;background:rgba(214,184,150,.8);border-radius:3px;z-index:3}
.tape.l{left:22px;transform:rotate(-8deg)}.tape.r{right:22px;transform:rotate(8deg)}
.view{display:none;flex:1;min-height:0;overflow-y:auto;padding:26px 18px 18px;flex-direction:column;gap:14px}
.view.on{display:flex}
h1{font-size:34px;margin:0;color:var(--accent);text-align:center}
h2{font-size:22px;margin:0}
.chip{display:inline-block;background:var(--pink2);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:14px}
.btn{border:0;border-radius:18px;padding:14px 18px;font:inherit;font-size:18px;color:#fff;background:var(--pink);box-shadow:0 4px 0 #d9858d;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9858d}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--green2);border:2px solid var(--green2)}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:999px;box-shadow:0 3px 0 var(--green2)}
input{width:100%;padding:14px;border:2px dashed var(--green2);border-radius:16px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--pink)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;background:var(--green);padding:5px;border-radius:18px}
.tabs button{flex:1;border:0;border-radius:14px;padding:10px;font:inherit;font-size:16px;background:transparent;color:var(--ink);cursor:pointer}
.tabs button.on{background:#fff;color:var(--accent);box-shadow:0 2px 0 var(--green2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border:2px solid var(--green2);border-radius:20px;padding:12px 4px;text-align:center;cursor:pointer;box-shadow:0 3px 0 var(--green2)}
.tile b{display:block;font-size:40px;color:var(--accent);font-weight:400}
.tile small{font-size:12px;background:var(--green);border-radius:99px;padding:2px 8px}
.tile.done{background:var(--pink2);border-color:var(--pink)}
.card{background:#fff;border:3px solid var(--green2);border-radius:24px;padding:16px;text-align:center}
.big{font-size:72px;line-height:1.1;color:var(--accent)}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w{background:#fff;border:2px solid var(--green2);border-radius:16px;padding:8px;text-align:center;transition:.2s}
.w.hl{background:var(--pink2);border-color:var(--pink);transform:scale(1.05)}
.w i{font-style:normal;font-size:32px;display:block}
.mic{width:88px;height:88px;border-radius:50%;border:5px solid #fff;background:var(--pink);box-shadow:0 5px 0 #d9858d;font-size:36px;cursor:pointer;align-self:center}
.mic.rec{background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,114,125,.5)}100%{box-shadow:0 0 0 22px rgba(232,114,125,0)}}
.fb{min-height:44px;text-align:center;font-size:16px;border-radius:16px;padding:8px 12px}
.fb.ok{background:#e4f1d8;color:#4b7c35}.fb.no{background:#fbe3e5;color:#b0525a}.fb.info{background:var(--green)}
.bar{height:14px;background:var(--green);border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--pink);width:0;transition:width .8s}
.pals{position:absolute;bottom:-6px;right:12px;font-size:34px;pointer-events:none;opacity:.9}
.bdg{width:100%;max-width:64px;aspect-ratio:1;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;background:radial-gradient(circle at 35% 30%,#ffc2c8,var(--pink) 60%,#e07983);border:4px solid #fff;box-shadow:0 0 0 3px var(--pink),0 4px 0 #d9858d}
.bdg.off{background:#e8e2d3;color:#fff;box-shadow:0 0 0 3px #d9d2c0;opacity:.6}
.bdg.sm{width:30px;height:30px;max-width:none;margin:0;font-size:15px;border-width:2px;box-shadow:0 0 0 2px var(--pink)}
.bdg.big2{width:130px;max-width:none;font-size:70px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.srow{flex-wrap:wrap}.bw{flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px}
.srow{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px dashed var(--green2);font-size:15px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:9;display:none;max-width:90%;font-size:15px}
#conf{position:fixed;inset:0;background:rgba(243,236,220,.94);z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:30px;color:var(--accent)}
</style>
</head>
<body>
<div id="toast"></div>
<div id="conf"><div style="font-size:80px">🐰🐿️</div>삐약삐약! 뱃지 획득!</div>
<div class="frame"><div class="board"><span class="tape l"></span><span class="tape r"></span>

<section id="v-login" class="view on" style="justify-content:center">
  <h1>🐥 삐약 파닉스</h1>
  <div style="text-align:center"><span class="chip">토끼·다람쥐와 영어 발음 연습!</span></div>
  <div class="tabs"><button id="t-s" class="on" onclick="loginTab('s')">학생</button><button id="t-t" onclick="loginTab('t')">선생님</button></div>
  <div id="s-in" style="display:grid;gap:10px"><input id="lid" placeholder="학번 (예: 20401)" inputmode="numeric"><input id="lname" placeholder="이름"></div>
  <input id="lpw" type="password" placeholder="비밀번호">
  <button class="btn" id="lbtn" onclick="login()">시작하기 🐣</button>
  <div class="pals">🐰🐿️</div>
</section>

<section id="v-home" class="view">
  <div class="row"><div><span class="chip">환영해, 친구야!</span><h2 id="uname"></h2></div><button class="btn sm alt" onclick="showBadges()">나의 뱃지 🏅</button></div>
  <div class="row"><h2>어떤 소리를 배울까? 🐣</h2><button class="btn sm alt" id="lo" onclick="logout()">로그아웃</button></div>
  <div class="tabs"><button id="t-v" onclick="grid('v')">모음</button><button id="t-c" onclick="grid('c')">자음</button></div>
  <div id="pg" class="grid"></div>
</section>

<section id="v-badge" class="view">
  <div class="row"><h2>나의 뱃지들 🏅</h2><button class="btn sm alt" onclick="showHome()">뒤로</button></div>
  <div class="card"><div class="row"><span>모은 뱃지</span><b id="bc" style="font-size:26px;color:var(--accent)">0/26</b></div><div class="bar"><div id="bp"></div></div></div>
  <div id="bg" class="grid" style="grid-template-columns:repeat(5,1fr)"></div>
</section>

<section id="v-pos" class="view" style="justify-content:center;text-align:center">
  <div class="row" style="position:absolute;top:22px;left:18px;right:18px"><span class="chip">학습 위치 선택</span><button class="btn sm alt" onclick="showHome()">뒤로</button></div>
  <div class="big" id="pl"></div>
  <h2>이 알파벳이 단어의 어디에 올 때 연습할까요?</h2>
  <div id="pb" style="display:grid;gap:12px"></div>
</section>

<section id="v-intro" class="view">
  <div class="row"><span class="chip">미니 강의</span><button class="btn sm alt" onclick="showPos(cur)">다시 선택</button></div>
  <div class="card row"><div class="big" style="font-size:52px" id="il"></div><span style="flex:1">▶ 눌러서 소리를 들어요!</span><button class="btn" onclick="playIntro()">▶</button></div>
  <div id="iw" class="words"></div>
  <button class="btn" onclick="startPractice()">연습 시작! 🐥</button>
</section>

<section id="v-prac" class="view">
  <div class="row"><span class="chip" id="pp"></span><button class="btn sm alt" onclick="showHome()">그만하기</button></div>
  <div class="card" style="position:relative">
    <span class="chip" id="ppos"></span>
    <div id="pi" style="font-size:80px;cursor:pointer" onclick="speak(words[idx].t)">🍎</div>
    <div id="pw" style="font-size:40px;color:var(--accent)"></div>
    <div id="pm" style="font-size:20px"></div>
    <button class="btn" style="margin-top:8px" onclick="speak(words[idx].t)">🔊 듣기</button>
  </div>
  <div id="fb" class="fb info">마이크를 누르고 또렷하게 말해요!</div>
  <button id="mic" class="mic" onclick="toggleMic()">🎤</button>
  <div class="row" style="justify-content:center"><button class="btn sm alt" id="skip" style="display:none" onclick="nextWord(0)">건너뛰기 ➡</button></div>
</section>

<section id="v-teacher" class="view">
  <div
